name: Build & deploy situs

on:
  # Cek data Firestore secara berkala. Jam dalam UTC (WIB = UTC+7).
  # Kalau tidak ada yang berubah, tidak ada deploy.
  schedule:
    - cron: '0 */3 * * *'   # tiap 3 jam
  # Tombol "Run workflow" di tab Actions, untuk terbit sekarang juga
  workflow_dispatch:
  # Otomatis saat index.html / build.js / firebase.json diubah
  push:
    branches: [main]
    paths: ['index.html', 'build.js', 'firebase.json']

permissions:
  contents: read
  checks: write

concurrency:
  group: deploy-situs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pastikan alamat situs sudah diisi
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Variabel SITE_URL belum diisi. Buka Settings > Secrets and variables > Actions > Variables, lalu tambahkan SITE_URL (contoh: https://alamat-anda.com)"
            exit 1
          fi

      - name: Build (ambil data terbaru dari Firestore)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node build.js

      - name: Catat isi hasil build
        run: |
          mkdir -p .deploy-marker
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > .deploy-marker/manifest.txt

      # Kalau isi hasil build sama persis dengan yang terakhir di-deploy, langkah deploy dilewati.
      - name: Cek riwayat deploy
        id: last
        uses: actions/cache@v4
        with:
          path: .deploy-marker
          key: deployed-${{ hashFiles('dist/**') }}

      - name: Deploy ke Firebase Hosting
        if: steps.last.outputs.cache-hit != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Nama secret ini dibuat otomatis oleh: firebase init hosting:github
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SDNTANJUNG_4AF13 }}
          projectId: sdntanjung-4af13
          channelId: live

      - name: Ringkasan
        run: |
          if [ "${{ steps.last.outputs.cache-hit }}" = "true" ]; then
            echo "Tidak ada perubahan sejak deploy terakhir, deploy dilewati." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Situs diperbarui: $(find dist/aplikasi -mindepth 1 -maxdepth 1 -type d | wc -l) halaman aplikasi." >> "$GITHUB_STEP_SUMMARY"
          fi
